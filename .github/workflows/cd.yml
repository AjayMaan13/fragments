# Continuous Delivery Workflow
#
# This should happen whenever we push a new tag, and we tag an existing
# commit after we know it's good (e.g., has been tested).
#
# To create a new tag, we also need to update the package.json version:
#
# $ npm version 0.7.0
#
# This will update `version` in package.json to `0.7.0` and create a new
# tag, `v0.7.0` in git. We'll then use this tag (i.e., `v0.7.0`) to tag
# our docker image before we push to AWS.
#
# Terraform (infra/) owns the infrastructure and the task definition's settings.
# This workflow only ships a new image: it copies the running task definition,
# swaps in the new image, and rolls the service onto it.
name: cd

on:
  push:
    # Whenever a new tag is pushed
    tags:
      # Any tag starting with v... should trigger this workflow.
      - 'v**'

# Lets the job ask GitHub for a signed token that AWS trusts (no stored keys)
permissions:
  id-token: write
  contents: read

jobs:
  # NOTE: this assumes our CI jobs have already passed previously
  # (i.e., that we don't tag a commit manually until we know a build is working)
  aws:
    name: AWS
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      # Use buildx, which is faster and can optimize the build steps
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The role is created by Terraform (see `terraform output github_deploy_role_arn`)
      # and stored in the repo's Actions variables as AWS_DEPLOY_ROLE_ARN
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      # Login to our ECR repository using the configured credentials
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build and Push an Image to Amazon ECR
      - name: Build and push to Amazon ECR
        env:
          # Define an Environment Variable with our ECR Registry, getting
          # the value from the previous step's outputs
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # Define an Environment Variable with our ECR Repository Name
          ECR_REPO: fragments
          # We'll give this image two different tags. First, we'll use the git tag (vX.Y.Z)
          # so that we can always go back and re-create this setup again in the future
          # if we have to test or debug something. Second, we'll also replace the
          # `latest` tag, since this is our most up-to-date version.
          VERSION_TAG: ${{ github.ref_name }}
        uses: docker/build-push-action@v7
        with:
          push: true
          # Use the git tag version and `latest`
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ env.VERSION_TAG }}, ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest

      # The service only exists while the infrastructure is up (`terraform apply`).
      # If it has been torn down, the image above is still pushed and we stop here.
      - name: Check the ECS service is running
        id: service
        run: |
          status=$(aws ecs describe-services --cluster fragments-cluster --services fragments-service \
            --query 'services[0].status' --output text)
          echo "status=$status"
          echo "up=$([ "$status" = ACTIVE ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Skip deploy notice
        if: steps.service.outputs.up != 'true'
        run: echo "::notice::Image pushed, but the ECS service is not running. Run terraform apply, then re-run this workflow."

      # Copy the task definition Terraform created, minus the fields ECS sets itself
      - name: Get the current ECS task definition
        if: steps.service.outputs.up == 'true'
        run: |
          aws ecs describe-task-definition --task-definition fragments-task --query taskDefinition \
            | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' \
            > task-definition.json

      # Update the ECS Task Definition JSON to use the image we just pushed
      - name: Fill in the new image ID in the Amazon ECS task definition
        if: steps.service.outputs.up == 'true'
        id: update-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPO: fragments
          VERSION_TAG: ${{ github.ref_name }}
        with:
          task-definition: task-definition.json
          # Must match the container name in the ECS task definition exactly
          container-name: fragments-container
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ env.VERSION_TAG }}

      # Register the updated task definition and deploy it to our ECS service
      - name: Deploy Amazon ECS task definition
        if: steps.service.outputs.up == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.update-task-def.outputs.task-definition }}
          cluster: fragments-cluster
          service: fragments-service
          wait-for-service-stability: true
