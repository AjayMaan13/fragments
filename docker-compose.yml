# docker-compose.yml

services:
  # Fragments microservice API server
  fragments:
    # Use a proper init process (tini)
    init: true
    # Build the Docker Image using the Dockerfile
    # and current directory as the build context
    build: .
    # Environment variables to use
    environment:
      # Our API will be running on http://localhost:8080
      - API_URL=http://localhost:8080
      # The image bakes in NODE_ENV=production, but Basic Auth (HTPASSWD_FILE)
      # is only allowed when NODE_ENV isn't 'production' (see src/auth/index.js).
      # Override it here since this compose setup is for local/testing use.
      - NODE_ENV=development
      # Use Basic Auth (for running tests, CI)
      - HTPASSWD_FILE=tests/.htpasswd
      # Use the FRAGMENTS_LOG_LEVEL set in the host environment, or default to info
      - FRAGMENTS_LOG_LEVEL=${FRAGMENTS_LOG_LEVEL:-info}
      - AWS_REGION=us-east-2
      # Dummy credentials so the AWS SDK has something to use when talking to
      # MiniStack (MiniStack doesn't validate them, but the SDK still needs
      # some credentials present to proceed at all).
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      # Use the MiniStack endpoint vs. AWS for S3 AWS SDK clients.
      # NOTE: we use Docker's internal network to the ministack container
      - AWS_S3_ENDPOINT_URL=http://ministack:4566
      # Use the DynamoDB local endpoint vs. AWS for DynamoDB AWS SDK clients.
      - AWS_DYNAMODB_ENDPOINT_URL=http://dynamodb-local:8000
      # This S3 bucket and DynamoDB table need to get created first, see
      # local-aws-setup.sh. We'll default to 'fragments' as the name, unless
      # something else is defined in the env.
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-fragments}
      - AWS_DYNAMODB_TABLE_NAME=${AWS_DYNAMODB_TABLE_NAME:-fragments}
      # Async conversion jobs: a queue in MiniStack and a second table, both
      # created by local-aws-setup.sh. The worker below gets the same values.
      - AWS_DYNAMODB_JOBS_TABLE_NAME=fragments-jobs
      - AWS_SQS_ENDPOINT_URL=http://ministack:4566
      - AWS_SQS_QUEUE_URL=http://ministack:4566/000000000000/fragments-jobs
    # Ports to publish
    ports:
      - '8080:8080'

  # Queue worker: the same image, started with a different command. It takes
  # conversion jobs off the SQS queue (see src/worker.js). It has no port and
  # needs no auth settings.
  fragments-worker:
    init: true
    build: .
    command: ['node', 'src/worker.js']
    environment:
      - NODE_ENV=development
      - FRAGMENTS_LOG_LEVEL=${FRAGMENTS_LOG_LEVEL:-info}
      - AWS_REGION=us-east-2
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_S3_ENDPOINT_URL=http://ministack:4566
      - AWS_DYNAMODB_ENDPOINT_URL=http://dynamodb-local:8000
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-fragments}
      - AWS_DYNAMODB_TABLE_NAME=${AWS_DYNAMODB_TABLE_NAME:-fragments}
      - AWS_DYNAMODB_JOBS_TABLE_NAME=fragments-jobs
      - AWS_SQS_ENDPOINT_URL=http://ministack:4566
      - AWS_SQS_QUEUE_URL=http://ministack:4566/000000000000/fragments-jobs
    # The queue and table are created after the containers start; if the worker
    # beats them to it, it logs the error and keeps retrying
    depends_on:
      - ministack
      - dynamodb-local

  # DynamoDB Local, see: https://hub.docker.com/r/amazon/dynamodb-local
  dynamodb-local:
    image: amazon/dynamodb-local
    ports:
      # Default port is 8000
      - '8000:8000'
    # Run the database in memory, see:
    # https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DynamoDBLocal.UsageNotes.html
    command: ['-jar', 'DynamoDBLocal.jar', '-inMemory']

  # MiniStack for S3, see https://ministack.org/docs/
  ministack:
    # https://hub.docker.com/r/ministackorg/ministack
    image: ministackorg/ministack
    ports:
      - '4566:4566'
    environment:
      # See https://ministack.org/docs/configuration for config details.
      # We only want S3 (fragment data) and SQS (the job queue)
      - SERVICES=s3,sqs
      # We will use us-east-2
      - MINISTACK_REGION=us-east-2
